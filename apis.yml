aid: voize
name: voize
description: >-
  voize is a German healthcare AI company (voize GmbH) building a voice-documentation
  platform for long-term care, skilled nursing, and disability-support facilities.
  Caregivers speak naturally on a smartphone during patient care and voize's on-device
  and cloud speech models convert the free speech into structured, categorized entries
  that sync bi-directionally in real time into the facility's electronic health record
  (EHR) system. The product reduces documentation burden for nursing staff, works
  offline, recognizes patient names and corrects grammar, and integrates directly with
  major EHRs used in skilled nursing. voize is backed by HV Capital and operates in
  Germany and the United States. It ships a mobile application rather than a public
  developer API, but exposes EHR integrations, a trust center, and a vulnerability
  disclosure / bug bounty program on its public surface.
